server:
  port: 8088
  servlet:
    context-path: /api

spring:
  application:
    name: pingan-ams-admin
  
  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pingan_ams?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      
  # Redis 配置
  data:
    redis:
      host: 10.169.2.15
      port: 32411
      password: m1qDOLodwaINq8s
      database: 0
      
  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.pingan.ams.model.entity
  type-enums-package: com.pingan.ams.model.enums
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j 配置
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn

# 业务配置
pingan:
  ams:
    # 实名认证是否开启人脸识别
    face-auth-enabled: false
    # JWT密钥
    jwt-secret: pingan-ams-jwt-secret-key-2024-must-be-at-least-256-bits
    # Token有效期（天）
    token-expire-days: 7
    # 文件上传配置
    upload:
      path: ./uploads
      url-prefix: http://localhost:8088/api/files
      max-size: 10485760  # 10MB

# 日志配置
logging:
  level:
    com.pingan.ams: debug
    org.springframework: info
